dJgAh+WgLjgwF8kP2pTacksXHbDh99Nldhf8dnCfITxuHUVu4RA9N7xqj8mUAGKYgiLDJAAABFjmQAA"}],"sections":[{"number":2,"kicker":"PRODUCT REFERENCE","title":"Six burgers. One build standard.","intro":"The products and layer order follow the existing burger assembly references. Additional sauce, vegetable and garnish weights are suggested starting points, not tested final recipes.","groups":[{"heading":"","blocks":[{"kind":"table","rows":[["BURGER","PROTEIN / CHEESE","SAUCE PORTION","OTHER INGREDIENTS"],["01  Funky Smash","2 × 70 g beef; 2 cheddar slices (20 g each)","20 g honey mustard; 15 g ketchup","15 g pickles; 15 g iceberg"],["02  Caramel Smash","2 × 70 g beef; 2 cheddar slices (20 g each)","20 g honey mustard","15 g pickles; 25 g bacon; 35 g caramelized onion"],["03  Bacon Jalapeño Smash","2 × 70 g beef; 2 cheddar slices (20 g each)","20 g House Sauce (bottom); 10 g (top)","18 g pickled jalapeños; 15 g iceberg; 25 g bacon"],["04  Cheese Burger","1 × 150 g beef patty; cheddar 20 g","20 g House Sauce (bottom); 10 g (top)","15 g pickles; 15 g iceberg; 30 g tomato"],["05  Burger Egg","1 × 70 g beef; cheddar 20 g","20 g House Sauce (bottom); 10 g (top)","15 g pickles; 25 g bacon; 1 fried egg"],["06  Crispy Chicken","1 breaded chicken portion (~150 g cooked target)","20 g House Sauce (bottom); 10 g (top)","70 g coleslaw"]]}]},{"heading":"PORTIONING GUIDANCE","blocks":[{"kind":"table","rows":[["STANDARD BASE\n•  Use one whole brioche bun per burger; standard bun target approximately 75 g.\n•  Weigh beef portions before service, not while a ticket is waiting.\n•  Use a consistent spoon, bottle or scale for every sauce portion.\n•  Match cheese slices and other toppings to the burger card.","RECIPE DISCIPLINE\n•  Follow the pictured sequence from the bottom bun upwards.\n•  Do not switch from a double-smash to a single patty without an approved menu change.\n•  Use the same approved House Sauce, Honey Mustard and coleslaw preparations every day.\n•  Review any proposed changes in a tasting, then update all copies of the master recipe."]]},{"kind":"p","value":"IMPORTANT   Protein sizes of 70 g / 150 g reflect the supplied burger references. Other ingredient weights on this page are provisional operating targets. The final kitchen team must test and approve them before use as fixed standards."}]}]},{"number":3,"kicker":"KITCHEN ORGANISATION","title":"Design the working flow.","intro":"A recommended operational arrangement rather than a measured technical floor plan. The objective is to reduce crossing, waiting and unnecessary handling.","groups":[{"heading":"PRODUCT MOVES IN ONE DIRECTION","blocks":[{"kind":"table","rows":[["01\nCOLD PREP\nPortion, sauces, produce","02\nHOT LINE\nBeef, chicken, bacon, egg","03\nASSEMBLY\nToast, sauces, layers","04\nPASS\nCheck, wrap and release"]]}]},{"heading":"RESPONSIBILITIES AT EACH WORKING ZONE","blocks":[{"kind":"table","rows":[["ZONE","DAILY WORK","IMPORTANT POSITIONING PRINCIPLE"],["Cold prep","Portion beef, prepare vegetables, fill sauces, prepare coleslaw, organise raw poultry separately.","Chilled product stays off the hot line until needed; ready-to-eat garnishes stay clear of raw poultry."],["Hot line","Smash beef, cook the 150 g patty, fry chicken, cook bacon and egg; toast buns as the ticket progresses.","Cook has clear access to safe tools and an unobstructed handoff point."],["Assembly","Follow exact layer order for each burger; use consistent sauce and topping portions.","Burger build cards and ingredients remain in direct view and reach."],["Pass / pickup","Match burger to ticket, verify modifications, wrap and release promptly.","Completed orders do not travel back through raw food prep or dirty work areas."]]}]},{"heading":"PRACTICAL LAYOUT RULES","blocks":[{"kind":"table","rows":[["KEEP WORK MOVING FORWARD\n•  Position the pass immediately after assembly, not across the kitchen.\n•  Keep buns, cheese and cooking tools accessible without walking through another station.\n•  Allow space to hold two concurrent orders without mixing components.","KEEP TASKS SEPARATED\n•  Give raw chicken dedicated prep tools and a separate handling route.\n•  Do not position dirty dishes or waste beside ready-to-eat garnishes.\n•  Maintain clear handwashing access and usable space around hot equipment."]]},{"kind":"p","value":"SITE ADAPTATION   Exact bench locations, cooking line dimensions and utilities must be adjusted to the actual premises. This illustration communicates work sequence only."}]}]},{"number":4,"kicker":"COOKING STATION STANDARDS","title":"Consistency starts at the hot line.","intro":"Define the cooking method for each product and make the handoff to assembly predictable. Exact cook settings are validated on the installed equipment.","groups":[{"heading":"","blocks":[{"kind":"table","rows":[["PRODUCT / TOOL","WORKING METHOD","WHAT TO WATCH FOR"],["70 g smash beef","Place the portion on the griddle, smash firmly at the start, season according to the approved recipe, flip and melt cheddar.","Even contact, strong browned surface, no repeated pressing and correct patty count."],["150 g beef patty","Cook as the single 150 g Cheese Burger patty standard; use the tested method for that thickness.","Do not automatically treat as two smash patties. Check cooking completeness with the approved thermometer method."],["Crispy chicken","Keep breaded chicken separated from beef assembly tools. Fry to the approved safe cooked condition.","Crisp coating, fully cooked centre, controlled oil condition and no raw-poultry cross-contact."],["Bacon / egg / onion","Prepare bacon consistently; cook eggs to the agreed menu standard; portion the caramelized onion.","No soggy bacon, cold onions or inconsistent egg appearance from order to order."],["Brioche / cheddar","Toast each bun cut-side down and melt cheese on its assigned patty.","Warm bun without burnt edges; cheddar soft and integrated rather than added cold."],["Griddle / fryer tools","Use clean rigid spatulas, smash press, tongs, timers and appropriate temperature probes.","Avoid sharing tools between raw poultry and cooked / ready-to-eat food."]]}]},{"heading":"A REPEATABLE COOK SEQUENCE","blocks":[{"kind":"table","rows":[["1  CALL\nRead item and modifications.","2  START\nBegin longest-cook item first.","3  FINISH\nMelt cheese / finish hot sides.","4  HANDOFF\nTell assembly what is ready."]]},{"kind":"p","value":"SAFETY NOTE   Cooking and holding must follow the applicable local food-safety requirements and the restaurant’s verified equipment procedure. This manual is an operational guide, not a substitute for required food-safety controls."}]}]},{"number":5,"kicker":"PREPARATION ROUTINE","title":"Build a calm service before it starts.","intro":"A well-prepared line reduces ticket times, portion errors and repeated trips to storage. Use preparation as a structured sequence, not an improvised rush.","groups":[{"heading":"RECOMMENDED ORDER OF PREPARATION","blocks":[{"kind":"table","rows":[["STEP","TASK","GOOD OPERATING PRACTICE"],["01","Reset the work areas","Start on clean, clear benches. Put dedicated poultry tools away from the garnish area."],["02","Portion proteins","Prepare 70 g beef balls, single 150 g patties and agreed chicken portions separately. Verify a sample with the scale."],["03","Prepare cold toppings","Wash and cut lettuce / tomato, portion pickles and jalapeños, make coleslaw and caramelized onions to the agreed recipe."],["04","Prepare sauces","Bring House Sauce, Honey Mustard and ketchup to the line in controlled, identified bottles; confirm bottle tips and portion output."],["05","Set the assembly line","Place all garnishes in build sequence. Check bun supply, cheddar, bacon and eggs at their appropriate stations."],["06","Test and brief","Confirm griddle, fryer and toaster readiness. Walk through the first expected ticket and review any substitutions or shortages."]]}]},{"heading":"REPLENISHMENT DURING SERVICE","blocks":[{"kind":"table","rows":[["WHAT TO DO\n•  Top up the line in small batches based on current demand.\n•  Restore the same ingredient order after every refill.\n•  Keep reserve product properly stored until needed.\n•  Change tools when moving between raw and cooked / ready-to-eat tasks.","WHAT TO AVOID\n•  Do not portion beef by eye during a rush.\n•  Do not refill sauce bottles without verifying identity and condition.\n•  Do not crowd the line with all-day quantities.\n•  Do not improvise missing toppings without approval and ticket communication."]]},{"kind":"p","value":"KEY STANDARD   The kitchen should be able to cook, assemble and hand over each of the six menu items without stopping to search for an ingredient, a utensil or the correct build sequence."}]}]},{"number":6,"kicker":"FROM TICKET TO GUEST","title":"Control the handoffs.","intro":"Each order should move through the same five decisions. The goal is accuracy and speed without sacrificing the cooking or assembly standard.","groups":[{"heading":"ORDER FLOW DURING SERVICE","blocks":[{"kind":"table","rows":[["01\nREAD\nItem, quantity, modifiers","02\nFIRE\nStart protein; call timing","03\nBUILD\nToast; follow layer card","04\nVERIFY\nCheck against the ticket","05\nRELEASE\nWrap / box and hand off"]]}]},{"heading":"COMMUNICATION RULES AT THE STATION","blocks":[{"kind":"table","rows":[["SITUATION","REQUIRED BEHAVIOUR","AVOID"],["Normal order","Cook calls item and count; assembly confirms ready components and places them on the matching build card.","Silent handoffs and unlabeled groups of identical-looking burgers."],["Modified order","Repeat the modification at start and again at assembly; verify the change before wrapping.","Assuming the cook or assembler remembers a verbal request."],["Multiple orders","Keep each ticket grouped from the first protein to the final pass.","Mixing patties and components across orders during peak periods."],["Delay / remake","Stop, communicate the issue and remake correctly when needed.","Covering up a wrong burger or dispatching a compromised item."]]}]},{"heading":"FIVE CHECKS AT THE PASS","blocks":[{"kind":"table","rows":[["PRODUCT ACCURACY\n•  Correct burger name and number of portions.\n•  Right patty count / chicken portion and cheddar.\n•  All required toppings in the approved layer order.","GUEST-READY FINISH\n•  Bun is toasted, burger is intact and hot components are fresh.\n•  Packaging matches eat-in / takeaway handling.\n•  Special requests and allergy concerns are verified, never guessed."]]},{"kind":"p","value":"OPERATING RULE   A wrong or incomplete burger is corrected before it leaves the pass. Accuracy has priority over hiding a delay."}]}]},{"number":7,"kicker":"OPENING STANDARDS","title":"What to watch before the first order.","intro":"Use these points during the daily kitchen walk-through. They help the owner identify a problem early and correct it before the first ticket.","groups":[{"heading":"OPENING WALK-THROUGH: STANDARD, WARNING SIGN, RESPONSE","blocks":[{"kind":"table","rows":[["AREA","WHAT GOOD LOOKS LIKE","IF SOMETHING IS WRONG"],["Work surfaces","Clear, clean and organised benches; correct tools at each station.","Reset clutter immediately. Remove dirty tools before handling food."],["Griddle / fryer","Equipment has reached its validated operating settings and tools are available.","Do not start tickets with a cold or malfunctioning station."],["Beef portions","70 g balls and 150 g patties are differentiated and consistently weighed.","Reportion outliers and separate product types before service."],["Chicken handling","Raw poultry kept away from ready-to-eat garnishes and burger assembly tools.","Re-establish separation and clean any affected area before resuming."],["Sauces / garnishes","All sauces and toppings are ready, identified and positioned in build order.","Replace questionable batches; refill and re-order the rail."],["Buns / cheese","Enough buns, correctly prepared cheese and a working toasting method.","Re-stock from appropriate storage before accepting a backlog."],["Order station","Tickets can be read clearly, pack area is clear and six build cards are visible.","Fix display, communication or pass congestion first."]]}]},{"heading":"BRIEF THE TEAM IN 60 SECONDS","blocks":[{"kind":"table","rows":[["TODAY’S FOCUS\n•  Which items are expected to be busiest?\n•  Is there any approved menu change?\n•  Who handles hot line, assembly and pass?","WHAT EVERYONE MUST KNOW\n•  What needs extra care after yesterday’s service?\n•  Where will completed burgers wait for final verification?\n•  Who gives the final release decision?"]]}]},{"heading":"THE 4 RECURRING OPENING MISTAKES","blocks":[{"kind":"table","rows":[["Wrong portions\nProduct sizes vary before the first ticket.","Unclear stations\nPeople leave the line to find ingredients.","Unready equipment\nCooking begins before the line is stable.","No final check\nBurgers leave without a build verification."]]},{"kind":"p","value":"OPENING STANDARD   A station is ready only when people, ingredients, utensils and the correct recipe are all in place. The owner should model the same sequence every day."}]}]},{"number":8,"kicker":"SHIFT OPERATING DISCIPLINE","title":"During rush, after service, and in training.","intro":"Practical supervision standards for the owner. Demonstrate the method at the station, observe execution and correct deviations immediately.","groups":[{"heading":"DURING A BUSY SERVICE","blocks":[{"kind":"table","rows":[["FOCUS","RECOMMENDED OPERATING BEHAVIOUR","EARLY WARNING SIGN"],["Order pace","Call priorities clearly and start longer-cooking products first.","Many tickets open with nobody owning cooking sequence."],["Protein accuracy","Keep double-smash, single-smash and 150 g patty formats distinct.","Unidentified patties placed together or extra pressing on the griddle."],["Build discipline","Use the recipe card and do one burger accurately before sending it to the pass.","Sauces and layers added from memory; repeated rework."],["Line replenishment","Refill sauces and garnishes in controlled small amounts between tickets.","Overfilled rails, mixed product or loss of clear ingredient order."]]}]},{"heading":"WHEN THE LAST TICKET LEAVES","blocks":[{"kind":"table","rows":[["CLOSING SEQUENCE\n•  Remove / store or discard remaining food appropriately.\n•  Clean the griddle, fryer surroundings, prep benches and all food-contact utensils.\n•  Return tools and containers to the same assigned positions.\n•  Restore a clear and clean assembly / pickup area.","THINK ABOUT TOMORROW\n•  Which ingredient or sauce required repeated last-minute refills?\n•  Where did the cook-to-assembly handoff slow down?\n•  Were remakes caused by incorrect layers or unclear tickets?\n•  What one simple layout or preparation change will prevent recurrence?"]]}]},{"heading":"OWNER TRAINING: CAN THE METHOD BE DEMONSTRATED?","blocks":[{"kind":"table","rows":[["PRODUCT KNOWLEDGE\n•  Name all six burgers and describe each build.\n•  Explain the difference between 70 g smash and 150 g single patty.\n•  Demonstrate sauces and garnish portioning.","LIVE OPERATION\n•  Prepare a station without being prompted.\n•  Execute a ticket from call to hot-line handoff.\n•  Inspect a burger and correct an incorrect build.","SHIFT LEADERSHIP\n•  Run the opening briefing and guide work allocation.\n•  Correct an error calmly during a rush.\n•  Lead a consistent clean-down and next-day prep review."]]},{"kind":"p","value":"FINAL NOTE   These are the core kitchen practices intended for day-to-day use. Final portion weights, sauce recipes and equipment-specific cook methods must be confirmed through actual kitchen testing before opening."}]}]}],"preparedBy":"Fat Cacko / Nikola Isailovski","note":"Ingredient amounts beyond the source protein formats are provisional operating targets to be tested and approved."};</script>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',burgers:'<path d="M4 13h16M5 9c0-4 3-6 7-6s7 2 7 6H5ZM5 17h14M7 21h10"/>',kitchen:'<path d="M5 3v7m3-7v7m-3-2h3M6.5 10v11M18 3v18M18 3c-6 3-6 12 0 12"/>',guide:'<path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2z"/><path d="M4 5v17M8 7h8M8 11h8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',more:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',chevron:'<path d="m15 18-6-6 6-6"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',flame:'<path d="M12 22c5 0 8-3 8-7 0-3-2-6-6-10 0 4-3 4-3 8C7 10 8 7 8 5 2 10 4 22 12 22z"/>',box:'<path d="M4 7 12 3l8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',check:'<path d="M5 12l5 5L20 7"/>'};
function svg(key){return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[key]||icons.home}</svg>`}
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const state={route:'home',recipe:0,subtab:'opening',station:0};
const nav=[['home','Home','home'],['burgers','Burgers','burgers'],['kitchen','Kitchen','kitchen'],['guide','Daily Ops','guide']];
function urlFor(route,opts={}){
 if(route==='recipe')return '#recipe/'+Math.max(0,Math.min(5,Number(opts.recipe ?? state.recipe)));
 if(route==='guide')return '#guide/'+encodeURIComponent(opts.subtab||state.subtab||'opening');
 if(route==='kitchen')return '#kitchen/'+Math.max(0,Math.min(3,Number(opts.station ?? state.station)));
 return '#'+encodeURIComponent(route);
}
function readURL(){
 const raw=(location.hash||'#home').slice(1).split('/');
 const route=['home','burgers','recipe','kitchen','guide','about'].includes(raw[0])?raw[0]:'home';
 state.route=route;
 if(route==='recipe')state.recipe=Math.max(0,Math.min(5,Number(raw[1])||0));
 if(route==='guide')state.subtab=['prep','opening','service','closing'].includes(raw[1])?raw[1]:'opening';
 if(route==='kitchen')state.station=Math.max(0,Math.min(3,Number(raw[1])||0));
 render();window.scrollTo(0,0);
}
function navigate(route,opts={}){
 state.route=route;Object.assign(state,opts);
 const target=urlFor(route,opts);
 // Render immediately; hashchange synchronises Android's physical back action.
 render();window.scrollTo(0,0);
 if(location.hash!==target)location.hash=target;
}
function goBack(){
 // The visible back button always has a safe in-app destination.
 if(state.route==='recipe')navigate('burgers');
 else navigate('home');
}
function h(tag,attrs,contents){return `<${tag} ${attrs}>${contents}</${tag}>`}
function renderNav(){const mk=(btn,css='')=>`<button class="${css} ${state.route===btn[0]?'active':''}" data-route="${btn[0]}" aria-label="${btn[1]}" ${state.route===btn[0]?'aria-current="page"':''}>${css==='nav-btn'?svg(btn[2]):''}<span>${btn[1]}</span></button>`;document.getElementById('bottom-nav').innerHTML=nav.map(b=>mk(b,'nav-btn')).join('');document.getElementById('desktop-nav').innerHTML=nav.map(b=>mk(b,'')).join('')+`<button data-route="about" class="${state.route==='about'?'active':''}">About this guide</button>`}
function openRecipe(i){navigate('recipe',{recipe:i})}
function recipeMeta(r){let a=r.layers.find(x=>x.name.toLowerCase().includes('beef')||x.name.toLowerCase().includes('patt')||x.name.toLowerCase().includes('chicken'));return a?.portion||''}
function recipeTile(r,i){return `<button class="recipe-tile" data-recipe="${i}" aria-label="Open ${esc(r.name)} recipe"><div class="recipe-tile-image"><span class="recipe-num">${r.num}</span><img loading="lazy" src="${r.image}" alt="Exploded ingredient stack for ${esc(r.name)}"></div><div class="recipe-tile-bottom"><div class="recipe-tile-name">${esc(r.name)}</div><div class="recipe-tile-sub">${esc(r.subtitle)}</div></div></button>`}
function home(){
 const r=DATA.recipes[0];
 const daily=[
  ['opening','Opening','Set up the kitchen before the first order','clock'],
  ['prep','Preparation','Portion proteins, sauces and fresh ingredients','kitchen'],
  ['service','During service','Manage tickets, cooking and handoff','flame'],
  ['closing','Closing & training','Clean down, reset and keep standards','check']
 ];
 return `<div class="page home-page">
  <div class="home-welcome"><span class="eyebrow">FUNKY COW / KITCHEN GUIDE</span><h1>Everything in its place.</h1><p>A practical reference for the people running the kitchen. Choose a section to explore.</p></div>
  <button class="home-search" id="home-search" type="button" aria-label="Search all recipes and kitchen topics">${svg('search')}<span>Search recipes, ingredients, or tasks</span><span class="home-search-end">Search</span></button>
  <div class="home-section-head"><span>EXPLORE THE GUIDE</span><small>3 sections</small></div>
  <button type="button" class="home-feature home-feature-burger" data-route="burgers" aria-label="Browse all six burger recipes">
   <span class="home-feature-left"><span class="feature-index">01 / BURGER RECIPES</span><strong>Burgers</strong><span class="feature-description">6 visual recipes, exact layering order and portion guides.</span><span class="feature-link">Browse all six ${svg('arrow')}</span></span>
   <span class="feature-image"><img src="${r.image}" alt="Funky Smash ingredients" /></span>
  </button>
  <button type="button" class="home-feature home-feature-kitchen" data-route="kitchen" aria-label="Explore the kitchen stations and workflow">
    <span class="feature-index">02 / KITCHEN WORKFLOW</span><span class="feature-heading">Kitchen stations <span class="feature-round-arrow">${svg('arrow')}</span></span>
    <span class="feature-description">See how each order moves through the kitchen, with practical cooking standards.</span>
    <span class="station-preview"><span><b>01</b> Prep</span><i></i><span><b>02</b> Cook</span><i></i><span><b>03</b> Build</span><i></i><span><b>04</b> Pass</span></span>
  </button>
  <section class="daily-home" aria-labelledby="daily-home-title"><div class="daily-home-title"><div><span class="feature-index">03 / DAILY OPERATIONS</span><h2 id="daily-home-title">Run the day</h2><p>Practical guidance for each stage of a shift.</p></div><span class="daily-title-icon">${svg('guide')}</span></div>
    <div class="daily-links">${daily.map(d=>`<button type="button" class="daily-link" data-route="guide" data-subtab="${d[0]}" aria-label="Open ${d[1]} guidelines"><span class="daily-icon">${svg(d[3])}</span><span class="daily-link-text"><strong>${d[1]}</strong><small>${d[2]}</small></span><span class="daily-arrow">${svg('arrow')}</span></button>`).join('')}</div>
  </section>
  <div class="home-end"><span>FUNKY COW · KITCHEN REFERENCE</span><button type="button" data-route="about">About this guide ${svg('arrow')}</button></div>
 </div>`;
}
function burgers(){return `<div class="page"><div class="eyebrow">01 / STATION RECIPE CARDS</div><h1 class="h1">Every burger.<br>Same standard.</h1><p class="subtitle">Tap any product to view its ingredient order and portions. Every build reads from the <b>bottom bun upwards</b>.</p><div class="recipe-grid">${DATA.recipes.map(recipeTile).join('')}</div><div class="note">Protein formats follow the supplied recipe cards (70 g smash / 150 g single patty). Other portions are starting targets for approval, not final production weights.</div><details class="accordion"><summary>Portioning &amp; recipe discipline</summary><div class="accordion-body">${renderGroup(DATA.sections[0].groups.find(g=>g.heading.includes('PORTIONING')))}</div></details></div>`}
function recipeDetail(){let i=state.recipe,r=DATA.recipes[i];return `<div class="page"><div class="eyebrow">BURGER ${r.num} / 06</div><h1 class="h1">${esc(r.name)}</h1><div class="recipe-subtitle">${esc(r.subtitle)}</div><div class="recipe-detail-image"><img src="${r.image}" alt="Exploded view of ${esc(r.name)} layers"></div><div class="recipe-meta"><span>Bottom → top</span><span>${r.layers.length} layers</span><span>${esc(recipeMeta(r))}</span></div><div class="layer-title"><h2 class="h2">Assembly order</h2><small>START AT THE BOTTOM</small></div><div class="layers">${r.layers.map((l,n)=>`<div class="layer"><div class="layer-idx">${n+1}</div><div class="layer-name">${esc(l.name)}</div><div class="layer-amount">${esc(l.portion)}</div></div>`).join('')}</div><div class="note"><b>Provisional gram weights.</b> Confirm sauce, garnish and chicken portions with the owner before locking the master recipe.</div><div class="recipe-nav"><button ${i===0?'disabled':''} data-recipe="${i-1}">← Previous burger</button><button ${i===5?'disabled':''} data-recipe="${i+1}">Next burger →</button></div></div>`}
function splitLines(str){let v=String(str).split('\n').filter(Boolean);let title=v.shift()||'';return {title,lines:v.map(x=>x.replace(/^•\s*/,''))}}
function renderCard(title,body,warningLabel='',warningText=''){return `<div class="content-card"><div class="content-card-title">${esc(title)}</div>${body?`<p>${esc(body)}</p>`:''}${warningLabel?`<div class="watch-label">${esc(warningLabel)}</div><div class="watch-text">${esc(warningText)}</div>`:''}</div>`}
function renderGroup(group){if(!group)return '';return group.blocks.map(block=>{if(block.kind==='p')return `<div class="callout">${esc(block.value)}</div>`;const rows=block.rows,cols=rows[0].length;
if(rows.length>1){const header=rows[0];return rows.slice(1).map(r=>renderCard(r[0],r[1]||'',header[2]||'',r[2]||'')).join('');}
if(rows.length===1&&cols===2){return `<div class="twin">${rows[0].map(c=>{const o=splitLines(c);return `<div class="content-card"><div class="content-card-title">${esc(o.title)}</div><div class="simple-list" style="margin-top:10px">${o.lines.map(q=>`<div class="bullet-row">${esc(q)}</div>`).join('')}</div></div>`}).join('')}</div>`}
if(rows.length===1&&cols>=3){return `<div class="mini-flow">${rows[0].map(c=>{const v=String(c).split('\n');return `<div class="mini-flow-item"><div class="small-overline">${esc(v[0]||'')}</div><strong>${esc(v[1]||'')}</strong><span>${esc(v.slice(2).join(' '))}</span></div>`}).join('')}</div>`}return ''}).join('')}
function groupSection(s,ids){return s.groups.filter((g,i)=>!ids||ids.includes(i)).map(g=>`<h3 class="detail-head">${esc(g.heading)}</h3>${renderGroup(g)}`).join('')}
function kitchen(){let s=DATA.sections[1],c=DATA.sections[2];let zone=s.groups[1].blocks[0].rows.slice(1);return `<div class="page"><div class="eyebrow">02 / KITCHEN WORKFLOW</div><h1 class="h1">One order.<br>Four stations.</h1><p class="subtitle">Follow the flow from preparation to final handoff. <b>Tap any station</b> for guidance.</p><div class="kitchen-stations">${zone.map((z,i)=>`<div class="station-unit"><button class="station-accordion ${state.station===i?'active':''}" data-station="${i}" aria-expanded="${state.station===i?'true':'false'}"><span class="station-number">${String(i+1).padStart(2,'0')}</span><span class="station-label"><strong>${esc(z[0])}</strong><small>${['Portion & prepare','Cook the proteins','Build in correct layer order','Check & hand off'][i]}</small></span><span class="station-chevron">${svg('chevron')}</span></button>${state.station===i?`<div class="station-expanded"><p>${esc(z[1])}</p><div class="station-warning"><b>Watch for</b><span>${esc(z[2])}</span></div></div>`:''}</div>`).join('')}</div><h2 class="h2">Station standards</h2>${groupSection(s,[2])}<h2 class="h2" style="margin-top:28px">Cooking standards</h2><p class="subtitle" style="margin:8px 0 12px">${esc(c.intro)}</p>${groupSection(c)}<div class="note">Station layout is a workflow recommendation, not a technical floor plan. Follow verified on-site cooking and food safety procedures.</div></div>`}
function guide(){const tabs=[['opening','Opening'],['prep','Prep'],['service','Service'],['closing','Closing']];let sub=state.subtab;let parts=[];if(sub==='prep'){const s=DATA.sections[3];parts.push(sectionContent(s))}else if(sub==='opening'){const s=DATA.sections[5];parts.push(sectionContent(s))}else if(sub==='service'){const s=DATA.sections[4];parts.push(sectionContent(s)); const rush=DATA.sections[6];parts.push(`<div class="heading-row"><h2 class="h2">Working through a rush</h2></div>${groupSection(rush,[0])}`)}else if(sub==='closing'){const s=DATA.sections[6];parts.push(`<div class="eyebrow">${esc(s.kicker)}</div><h2 class="h2" style="margin-top:8px">After service &amp; owner training</h2><p class="subtitle">${esc(s.intro)}</p>${groupSection(s,[1,2])}`)}return `<div class="page"><div class="eyebrow">03 / DAILY OPERATIONS</div><h1 class="h1">A consistent shift.<br>Every day.</h1><p class="subtitle">Choose a stage of the day for practical guidance, common problems and what to do next.</p><div class="playbook-tabs">${tabs.map(t=>`<button class="pill ${sub===t[0]?'active':''}" data-subtab="${t[0]}">${t[1]}</button>`).join('')}</div>${parts.join('')}<div class="note">Use these guidelines alongside verified food-safety requirements and tested kitchen procedures.</div></div>`}
function sectionContent(s){return `<div class="eyebrow">${esc(s.kicker)}</div><h2 class="h2" style="font-size:24px;margin:8px 0 9px">${esc(s.title)}</h2><div class="block-intro">${esc(s.intro)}</div>${groupSection(s)}`}
function about(){return `<div class="page"><div class="about"><div class="eyebrow">FUNKY COW / KITCHEN OPERATIONS</div><h1>THANK YOU.</h1><p>Thank you for your trust and collaboration. Wishing the Funky Cow team a successful opening and continued success.</p><hr><div class="eyebrow">PREPARED BY</div><div class="name">FAT CACKO</div><div class="author">Nikola Isailovski</div><button class="pill" style="margin-top:34px" data-route="home">Back to guide</button></div></div>`}
function render(){let app=document.getElementById('app');renderNav();const b=document.getElementById('header-back'),brand=document.getElementById('header-brand');b.hidden=state.route==='home';brand.hidden=state.route!=='home';b.innerHTML=svg('chevron')+'<span>'+ (state.route==='recipe'?'All burgers':'Back to home')+'</span>';app.innerHTML=state.route==='home'?home():state.route==='burgers'?burgers():state.route==='recipe'?recipeDetail():state.route==='kitchen'?kitchen():state.route==='guide'?guide():about();document.getElementById('search-button').innerHTML=svg('search');document.getElementById('about-button').innerHTML=svg('more');document.title=`Funky Cow | ${state.route==='recipe'?DATA.recipes[state.recipe].name:state.route==='about'?'Credits':state.route==='guide'?'Daily operations':state.route==='kitchen'?'Kitchen':state.route==='burgers'?'Burgers':'Kitchen Guide'}`}
function getResults(q){let norm=q.trim().toLowerCase();if(!norm)return [];let records=[...DATA.recipes.map((r,i)=>({title:r.name,description:r.subtitle,content:[r.name,r.subtitle,...r.layers.flatMap(l=>[l.name,l.portion])].join(' '),route:'recipe',idx:i})), ...DATA.sections.map((s,i)=>({title:s.title,description:s.kicker,content:JSON.stringify(s).toLowerCase(),route:i===1||i===2?'kitchen':i===0?'burgers':'guide',subtab:i===3?'prep':i===4?'service':i===5?'opening':'closing'}))];return records.filter(x=>x.content.toLowerCase().includes(norm)).slice(0,20)}
function searchModal(){const root=document.getElementById('modal-root');root.innerHTML=`<div class="overlay" id="search-overlay"><div class="search-modal" role="dialog" aria-modal="true" aria-label="Search Funky Cow guide"><div class="search-head"><input id="search-input" placeholder="Search burger, ingredient or topic…" autocomplete="off" aria-label="Search"><button id="search-close">Close</button></div><div class="results" id="search-results"><div class="empty-results">Try “smash”, “chicken”, “opening” or “pass”.</div></div></div></div>`;const input=document.getElementById('search-input');input.focus();input.addEventListener('input',()=>{const out=document.getElementById('search-results'),res=getResults(input.value);out.innerHTML=res.length?res.map((x,i)=>`<button class="result" data-result="${i}"><strong>${esc(x.title)}</strong><small>${esc(x.description)}</small></button>`).join(''):'<div class="empty-results">No matching section or burger found.</div>';out.querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{const x=res[Number(b.dataset.result)];closeSearch();if(x.route==='recipe')navigate('recipe',{recipe:x.idx});else if(x.route==='guide')navigate('guide',{subtab:x.subtab});else navigate(x.route)}))});document.getElementById('search-close').onclick=closeSearch;document.getElementById('search-overlay').addEventListener('click',e=>{if(e.target.id==='search-overlay')closeSearch()})}
function closeSearch(){document.getElementById('modal-root').innerHTML=''}
document.addEventListener('click',e=>{if(e.target.closest('#home-search')){searchModal();return;}let t=e.target.closest('[data-recipe],[data-route],[data-subtab],[data-station]');if(!t)return;if(t.dataset.recipe!==undefined){const n=Number(t.dataset.recipe);if(n>=0&&n<6)openRecipe(n)}else if(t.dataset.station!==undefined){const y=window.scrollY;state.station=Number(t.dataset.station);history.replaceState(null,'',urlFor('kitchen',{station:state.station}));render();window.scrollTo(0,y)}else if(t.dataset.subtab!==undefined){navigate(t.dataset.route||'guide',{subtab:t.dataset.subtab})}else if(t.dataset.route){navigate(t.dataset.route)}})
document.getElementById('header-back').addEventListener('click',goBack);window.addEventListener('hashchange',readURL);
document.getElementById('search-button').addEventListener('click',searchModal);document.getElementById('about-button').addEventListener('click',()=>navigate('about'));
document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goBack();}if(e.key==='Escape')closeSearch();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}})
readURL();
</script>
